<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Digital Library</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .book-icon {
            display: inline-block;
            border: 1px solid #ccc;
            padding: 25px; /* Padding বাড়ানো হয়েছে */
            margin: 20px; /* Margin বাড়ানো হয়েছে */
            width: 200px;  /* Width বাড়ানো হয়েছে */
            height: 220px; /* Height বাড়ানো হয়েছে */
            border-radius: 15px; /* Radius সামান্য বাড়ানো হয়েছে */
            text-decoration: none;
            color: black;
            font-size: 1.4em; /* Main font size বাড়ানো হয়েছে */
            font-weight: bold;
            vertical-align: top;
            box-sizing: border-box; /* Ensures padding is included in width/height */
        }
        .book-icon:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); /* Shadow বাড়ানো হয়েছে */
            transform: scale(1.05);
            transition: all 0.2s ease-in-out;
        }
        .book-icon img {
            width: 120px; /* ছবির Width বাড়ানো হয়েছে */
            height: 120px; /* ছবির Height বাড়ানো হয়েছে */
            display: block; /* Ensures image is centered */
            margin: 0 auto; /* Centers the image */
        }
        .book-icon span {
            display: block;
            margin-top: 15px; /* লেখার Margin বাড়ানো হয়েছে */
            font-size: 1.1em; /* লেখার Font size বাড়ানো হয়েছে */
        }
        #book1 { background-color: #e3f2fd; } /* হালকা নীল */
        #book2 { background-color: #e8f5e9; } /* হালকা সবুজ */
        #book3 { background-color: #fff3e0; } /* হালকা কমলা */
    </style>
</head>
<body>
    <h1>আপনার বইয়ের তালিকা</h1>

    <a href="books/book1.html" class="book-icon" id="book1">
        <img src="images/book1.svg" alt="Book 1 Icon">
        <span>Book 1</span>
    </a>

    <a href="books/book2.html" class="book-icon" id="book2">
        <img src="images/book2.svg" alt="Book 2 Icon">
        <span>Book 2</span>
    </a>

    <a href="#" class="book-icon" id="book3">
        <img src="images/book3.svg" alt="Book 3 Icon">
        <span>Book 3</span>
    </a>

</body>
</html>
